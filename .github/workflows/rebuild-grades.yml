name: Rebuild draft, trade and waiver grades

on:
  schedule:
    - cron: '0 12 * * 2' # Tuesdays 12:00 UTC, after Monday Night Football
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: rebuild-grades

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Finished seasons never change, so keep their Sleeper downloads between runs.
      - uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: sleeper-${{ github.run_id }}
          restore-keys: sleeper-

      - name: Test grading logic
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build data/deals.json
        run: python scripts/build_deals.py

      - name: Commit and publish if the grades changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/deals.json; then
            echo "Grades unchanged; nothing to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/deals.json
          git commit -m "Rebuild draft, trade and waiver grades"
          git push
          # Pushes made with the workflow token don't always start a Pages build.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
